<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OmniPulse">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="55%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <circle cx="256" cy="230" r="200" fill="url(#aura)" />
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="url(#rim)" stroke-width="14" />

  <g filter="url(#glow)">
    <path
      d="M 78 264 L 154 264 L 198 184 L 244 356 L 294 128 L 340 298 L 374 264 L 434 264"
      fill="none"
      stroke="url(#pulse)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
  <circle cx="294" cy="128" r="22" fill="#38bdf8" />
  <circle cx="294" cy="128" r="11" fill="#ffffff" />
</svg>
